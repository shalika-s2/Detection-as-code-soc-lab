title: Scheduled Task Creation via Schtasks
id: 7c4e1a92-0b3d-4f68-9e15-2a8d6b3c5f40
status: experimental
description: Detects creation of a scheduled task using schtasks.exe, a common persistence technique.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Shalika Weerasinghe
date: 2026/11/23
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_cli:
        CommandLine|contains: ' /create '
    condition: selection_img and selection_cli
falsepositives:
    - Legitimate software installers and admin tasks
level: medium
